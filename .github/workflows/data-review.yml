name: Review customs data deadlines
on:
  schedule:
    # 09:17 JST; GitHub may delay scheduled jobs. Manual runs are also available.
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: customs-data-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Inspect current deadlines
        shell: bash
        run: |
          set +e
          node scripts/review.ts --warn-days 7 > data-review.json
          review_status=$?
          set -e
          if [ "$review_status" -ne 0 ] && [ "$review_status" -ne 2 ]; then
            echo 'Deadline report generation failed; no tracking issue will be cleared.' >> "$GITHUB_STEP_SUMMARY"
            exit "$review_status"
          fi
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('data-review.json', 'utf8'));
          if (report.status !== 'clear') console.log('::warning::Customs data review status: ' + report.status + '. See the summary and tracking issue.');
          JS
      - name: Preserve deadline report
        id: artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: customs-data-review-${{ github.run_attempt }}
          path: data-review.json
          if-no-files-found: error
          retention-days: 30
  notify:
    needs: review
    # No PR trigger and no write token for a manually selected non-default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - name: Download this check's deadline report
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          artifact-ids: ${{ needs.review.outputs.artifact_id }}
          path: ${{ runner.temp }}/review-report
          merge-multiple: true
      - name: Update a single review tracking issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-review-issue.ts "$RUNNER_TEMP/review-report/data-review.json"
