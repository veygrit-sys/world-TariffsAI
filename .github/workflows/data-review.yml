name: Review customs data deadlines
on:
  schedule:
    # 09:17 JST; GitHub may delay scheduled jobs. Manual runs are also available.
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: customs-data-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      report: ${{ steps.report.outputs.report }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Inspect current deadlines
        id: report
        shell: bash
        run: |
          set +e
          node scripts/review.ts --warn-days 7 > data-review.json
          review_status=$?
          set -e
          if [ "$review_status" -ne 0 ] && [ "$review_status" -ne 2 ]; then
            echo 'Deadline report generation failed; no tracking issue will be cleared.' >> "$GITHUB_STEP_SUMMARY"
            exit "$review_status"
          fi
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('data-review.json', 'utf8'));
          if (report.status !== 'clear') console.log('::warning::Customs data review status: ' + report.status + '. See the summary and tracking issue.');
          appendFileSync(process.env.GITHUB_OUTPUT, 'report=' + Buffer.from(JSON.stringify(report)).toString('base64') + '\n');
          JS
      - name: Preserve deadline report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: customs-data-review
          path: data-review.json
          if-no-files-found: warn
          retention-days: 30
  notify:
    needs: review
    # No PR trigger and no write token for a manually selected non-default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - name: Update a single review tracking issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_REPORT_BASE64: ${{ needs.review.outputs.report }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const encoded = process.env.REVIEW_REPORT_BASE64;
          if (!encoded) throw new Error('MISSING_DATA_REVIEW_REPORT');
          writeFileSync('data-review.json', Buffer.from(encoded, 'base64'));
          JS
          node scripts/update-review-issue.ts data-review.json
